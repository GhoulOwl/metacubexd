name: Sync upstream and publish Docker Hub

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Push to Docker Hub (false runs build and smoke tests only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dockerhub-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream without overwriting fork changes
        id: sync
        run: bash docker/sync-upstream.sh

  build:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: DOCKERHUB_TOKEN
    env:
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'ghoulowl' }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'metacubexd-server' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: Check publishing configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Add the DOCKERHUB_TOKEN repository secret before publishing. Run manually with publish=false to test without credentials."
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ||
                ! "$DOCKERHUB_REPOSITORY" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Invalid Docker Hub username or repository name."
            exit 1
          fi
          echo "IMAGE=docker.io/$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${{ needs.sync.outputs.sha }}" >> "$GITHUB_ENV"

      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Check the registry rather than "upstream changed": a failed publication
      # remains eligible for retry on the next scheduled run.
      - name: Check whether this commit was already published
        id: existing
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$PUBLISH" == true && "$MANUAL" != true ]] &&
             docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" >/dev/null 2>&1; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Build amd64 image for startup checks
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/metacubexd-smoke:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Check panel, agent authentication and Mihomo kernel
        if: steps.existing.outputs.skip != 'true'
        run: bash docker/smoke-test.sh local/metacubexd-smoke:ci

      - name: Build both architectures and publish after startup checks
        id: image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.sync.outputs.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Record build result
        if: success()
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SKIPPED: ${{ steps.existing.outputs.skip }}
        run: |
          {
            echo "### MetaCubeXD Docker build"
            printf -- '- Upstream: `%s`\n' "$UPSTREAM_SHA"
            printf -- '- Fork commit: `%s`\n' "$SOURCE_SHA"
            printf -- '- Publish requested: `%s`\n' "$PUBLISH"
            printf -- '- Already published: `%s`\n' "$SKIPPED"
            printf -- '- Image: `%s:latest`\n' "$IMAGE"
            printf -- '- Commit tag: `%s:%s`\n' "$IMAGE" "$IMAGE_TAG"
            printf -- '- Build tag: `%s:build-%s-%s`\n' "$IMAGE" '${{ github.run_id }}' '${{ github.run_attempt }}'
            printf -- '- Digest: `%s`\n' "$DIGEST"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
